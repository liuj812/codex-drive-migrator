name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Test Windows PowerShell engine on isolated fixtures
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-Engine.ps1
      - run: ./build.ps1
      - name: Check packaged helper and GUI startup
        shell: pwsh
        run: |
          $p=Start-Process -FilePath dist/CodexDriveMigrator.exe -ArgumentList '--self-test self-test-result.json' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Packaged self-test failed'}
          $result=Get-Content self-test-result.json -Raw|ConvertFrom-Json
          if(-not $result.passed){throw 'Packaged verification failed'}
          $p=Start-Process -FilePath dist/CodexDriveMigrator.exe -ArgumentList '--ui-smoke-test' -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'GUI startup failed'}
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-Engine.ps1 -PythonExe "$PWD\dist\CodexDriveMigrator.exe" -FrozenHelper
          if($LASTEXITCODE -ne 0){throw 'Packaged migration engine test failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: CodexDriveMigrator-Windows-x64
          path: |
            dist/CodexDriveMigrator.exe
            dist/SHA256SUMS.txt
